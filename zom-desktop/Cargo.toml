[package]
name = "zom-desktop"
version = "0.1.0"
edition.workspace = true
description = "桌面入口层：组合 engine、workspace、view、command 与 AI 服务"

[[bin]]
name = "zom"
path = "src/main.rs"

[dependencies]
zom-command.workspace = true
zom-engine.workspace = true
zom-view.workspace = true
zom-workspace.workspace = true
gpui = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.23"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
resvg = { version = "0.45.1", default-features = false }
windows = { version = "0.57.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
