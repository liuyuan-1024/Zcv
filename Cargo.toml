[workspace]
members = [
    "zom-engine",
    "zom-workspace",
    "zom-view",
    "zom-command",
    "zom-ai",
    "zom-desktop",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
zom-engine = { path = "zom-engine" }
zom-workspace = { path = "zom-workspace" }
zom-view = { path = "zom-view" }
zom-command = { path = "zom-command" }
zom-ai = { path = "zom-ai" }
