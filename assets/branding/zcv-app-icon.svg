<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Zcv 线条式应用图标</title>
  <desc id="description">深色圆角方形内，连续的圆角折线与斜线连接出 Z、C、V 字母图形。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303438"/>
      <stop offset=".46" stop-color="#1E2225"/>
      <stop offset="1" stop-color="#0F1214"/>
    </linearGradient>
    <radialGradient id="ambient" cx=".24" cy=".13" r=".92">
      <stop offset="0" stop-color="#D7DEE1" stop-opacity=".17"/>
      <stop offset=".55" stop-color="#B7C3C8" stop-opacity=".035"/>
      <stop offset="1" stop-color="#B7C3C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
      <stop offset=".35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".26"/>
    </radialGradient>
    <linearGradient id="mark" x1="320" y1="290" x2="730" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".38" stop-color="#FAFBFC"/>
      <stop offset=".7" stop-color="#D9DEE1"/>
      <stop offset="1" stop-color="#969FA4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="155%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="soft-blur"/>
      <feOffset in="soft-blur" dx="7" dy="20" result="soft-offset"/>
      <feFlood flood-color="#000000" flood-opacity=".52" result="soft-color"/>
      <feComposite in="soft-color" in2="soft-offset" operator="in" result="soft-shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="contact-blur"/>
      <feOffset in="contact-blur" dx="1" dy="4" result="contact-offset"/>
      <feFlood flood-color="#000000" flood-opacity=".36" result="contact-color"/>
      <feComposite in="contact-color" in2="contact-offset" operator="in" result="contact-shadow"/>
      <feMerge>
        <feMergeNode in="soft-shadow"/>
        <feMergeNode in="contact-shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="mark-mask" maskUnits="userSpaceOnUse" x="250" y="260" width="530" height="500">
      <path d="M300 600V355Q300 305 350 305H720L305 718H665Q720 718 720 663V500L605 612L517.7 506.35" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round"/>
      <circle cx="300" cy="600" r="18" fill="#FFFFFF"/>
      <path d="M720 305L305 718" fill="none" stroke="#FFFFFF" stroke-width="38"/>
      <path d="M620 405H455Q410 405 410 450V480Q410 520 450 520H504" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#background)"/>
  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#ambient)"/>
  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#vignette)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="216.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#shadow)" transform="translate(512 512) scale(1.275) translate(-510 -511)">
    <rect x="250" y="260" width="530" height="500" fill="url(#mark)" mask="url(#mark-mask)"/>
  </g>
</svg>
