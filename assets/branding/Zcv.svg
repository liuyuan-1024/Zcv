      <stop stop-color="#26333E"/>
      <stop offset=".48" stop-color="#151F29"/>
      <stop offset="1" stop-color="#0B121B"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#02080D" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#background)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="#91A7B5" stroke-opacity=".19" stroke-width="3"/>

  <g transform="translate(0 -28)">
