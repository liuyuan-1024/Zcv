# One Light 主题 —— 浅色背景语法高亮配色。
appearance = "light"
#
# 与 onedark.toml 保持同一 Helix 兼容格式；消费 fg 与 modifiers 字段。
# palette 色值在浅色底色上保证 WCAG AA 级对比度（正文 ≥4.5:1）。

"tag" = { fg = "red" }
"attribute" = { fg = "gold" }
"comment" = { fg = "light-gray", modifiers = ["italic"] }
"constant" = { fg = "cyan" }
"constant.numeric" = { fg = "gold" }
"constant.builtin" = { fg = "gold" }
"constant.character.escape" = { fg = "gold" }
"constructor" = { fg = "blue" }
"function" = { fg = "blue" }
"function.builtin" = { fg = "blue" }
"function.macro" = { fg = "purple" }
"keyword" = { fg = "red" }
"keyword.control" = { fg = "purple" }
"keyword.control.import" = { fg = "red" }
"keyword.directive" = { fg = "purple" }
"keyword.storage" = { fg = "purple" }
"label" = { fg = "purple" }
"namespace" = { fg = "blue" }
"operator" = { fg = "purple" }
"keyword.operator" = { fg = "purple" }
"special" = { fg = "blue" }
"punctuation.special" = { fg = "blue" }
"punctuation.delimiter" = { fg = "blue" }
"string" = { fg = "green" }
"type" = { fg = "gold" }
"variable.builtin" = { fg = "blue" }
"variable.parameter" = { fg = "red" }
"variable.other.member" = { fg = "red" }

"markup.heading" = { fg = "red" }
"markup.raw.inline" = { fg = "green" }
"markup.bold" = { fg = "gold", modifiers = ["bold"] }
"markup.italic" = { fg = "purple", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.list" = { fg = "red" }
"markup.math" = { fg = "gold" }
"markup.quote" = { fg = "gold" }
"markup.link.url" = { fg = "cyan", modifiers = ["underlined"]}
"markup.link.text" = { fg = "purple" }
"text.title" = { fg = "red" }
"text.literal" = { fg = "green" }
"text.uri" = { fg = "cyan", modifiers = ["underlined"]}
"text.reference" = { fg = "purple" }
"text.emphasis" = { fg = "purple", modifiers = ["italic"] }
"text.strong" = { fg = "gold", modifiers = ["bold"] }
"text.strike" = { modifiers = ["crossed_out"] }

"diff.plus" = "green"
"diff.delta" = "gold"
"diff.minus" = "red"

"diagnostic.info".underline = { color = "blue", style = "curl" }
"diagnostic.hint".underline = { color = "green", style = "curl" }
"diagnostic.warning".underline = { color = "gold", style = "curl" }
"diagnostic.error".underline = { color = "red", style = "curl" }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
"info" = { fg = "blue", modifiers = ["bold"] }
"hint" = { fg = "green", modifiers = ["bold"] }
"warning" = { fg = "gold", modifiers = ["bold"] }
"error" = { fg = "red", modifiers = ["bold"] }

"ui.background" = { bg = "white" }
"ui.virtual" = { fg = "faint-gray" }
"ui.virtual.indent-guide" = { fg = "faint-gray" }
"ui.virtual.whitespace" = { fg = "light-gray" }
"ui.virtual.ruler" = { bg = "gray" }
"ui.virtual.inlay-hint" = { fg = "light-gray" }
"ui.virtual.jump-label" = { fg = "light-gray", modifiers = ["bold"] }

"ui.cursor" = { fg = "white", modifiers = ["reversed"] }
"ui.cursor.primary" = { fg = "white", modifiers = ["reversed"] }
"ui.cursor.match" = { fg = "blue", modifiers = ["underlined"]}

"ui.selection" = { bg = "faint-gray" }
"ui.selection.primary" = { bg = "light-gray" }
"ui.cursorline.primary" = { bg = "faint-gray" }

"ui.highlight" = { bg = "gray" }
"ui.highlight.frameline" = { bg = "#fde68a" }

"ui.linenr" = { fg = "light-gray" }
"ui.linenr.selected" = { fg = "black" }

"ui.statusline" = { fg = "white", bg = "dark-gray" }
"ui.statusline.inactive" = { fg = "gray", bg = "dark-gray" }
"ui.statusline.normal" = { fg = "white", bg = "blue", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "white", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "white", bg = "purple", modifiers = ["bold"] }

"ui.bufferline" = { fg = "gray", bg = "faint-gray" }
"ui.bufferline.active" = { fg = "black", bg = "white", underline = { color = "blue", style = "line" } }
"ui.bufferline.background" = { bg = "faint-gray" }

"ui.text" = { fg = "black" }
"ui.text.directory" = { fg = "blue" }
"ui.text.focus" = { fg = "black", bg = "faint-gray", modifiers = ["bold"] }

"ui.help" = { fg = "black", bg = "gray" }
"ui.popup" = { bg = "white" }
"ui.window" = { fg = "gray" }
"ui.menu" = { fg = "black", bg = "white" }
"ui.menu.selected" = { fg = "white", bg = "blue" }
"ui.menu.scroll" = { fg = "gray", bg = "light-gray" }

"ui.debug" = { fg = "red" }

[palette]

yellow = "#8B6914"
blue = "#2563EB"
red = "#DC2626"
purple = "#7C3AED"
green = "#16A34A"
gold = "#B45309"
cyan = "#0D9488"
white = "#FAFBFC"
black = "#1E2329"
dark-gray = "#374151"
light-black = "#E8EBF0"
gray = "#D1D5DB"
faint-gray = "#E8EBF0"
light-gray = "#9CA3AF"
linenr = "#C8CDD5"
[colors]
background = "#fafafaff"
"surface.background" = "#ebebebff"
"elevated_surface.background" = "#dfdfdfff"
"element.hover" = "#d3d3d3ff"
"element.selected" = "#d3d3d3ff"
"border.variant" = "#bcbcbcff"
"border.focused" = "#2563ebff"
text = "#1e1e1eff"
"text.muted" = "#838383ff"
"text.disabled" = "#919191ff"
"text.placeholder" = "#a6a6a6ff"
icon = "#838383ff"
"icon.muted" = "#919191ff"
"icon.on_accent" = "#fafafaff"
"icon.accent" = "#2563ebff"
success = "#16a34aff"
error = "#dc2626ff"
created = "#46a758ff"
modified = "#ffe629ff"
deleted = "#e5484dff"
conflict = "#e5484dff"
"title_bar.background" = "#dfdfdfff"
"status_bar.background" = "#d3d3d3ff"
"tab_bar.background" = "#dfdfdfff"
"tab.active_background" = "#ebebebff"
"toolbar.background" = "#ebebebff"
"panel.background" = "#e5e5e5ff"
"editor.background" = "#ebebebff"
"editor.active_line.background" = "#d3d3d380"
"editor.line_number" = "#919191ff"
"editor.active_line_number" = "#1e1e1eff"
"editor.selection.background" = "#2563eb3d"
"search.match_background" = "#2563eb8c"
"search.active_match_background" = "#ca8a0466"
"editor.cursor" = "#2563ebff"
"editor.diff_hunk.added_background" = "#2e9e484d"
"editor.diff_hunk.deleted_background" = "#78081a4d"
"scrollbar.track.background" = "#00000000"
"scrollbar.thumb.background" = "#91919173"
"scrollbar.thumb.hover_background" = "#9191918c"
"scrollbar.thumb.active_background" = "#919191a6"

