[package]
name = "zcv-editor"
version.workspace = true
edition.workspace = true
description = "可嵌入文本编辑组件"

[lib]
path = "src/editor.rs"
# 本 crate 无文档示例（doctest）；
# 关闭后可跳过 rustdoc --test 对整条 gpui 依赖图的重新解析，避免 build/test 之间 gpui test-support 特性切换导致的 stale rlib 误报 E0463。
doctest = false

[dependencies]
anyhow.workspace = true
gpui.workspace = true
sum-tree.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
zcv-actions.workspace = true
zcv-text.workspace = true
zcv-git.workspace = true
zcv-language.workspace = true
zcv-multi-buffer.workspace = true
zcv-project.workspace = true
zcv-settings.workspace = true
zcv-theme.workspace = true
zcv-ui.workspace = true
zcv-workspace.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
