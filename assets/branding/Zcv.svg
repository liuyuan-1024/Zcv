<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Zcv 无右 dock 图标概念稿</title>
  <desc id="description">深色底板上，顶部栏、中央编辑区、左 dock、终端与底部状态栏分离悬浮；编辑区显示 ZCV，终端显示命令提示符。</desc>
  <defs>
