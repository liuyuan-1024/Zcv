[package]
name = "zom-engine"
version = "0.1.0"
edition.workspace = true
description = "工业级纯粹文本编辑引擎底座"

[dependencies]
regex = "1.12.3"
ropey = "1.6.1"
thiserror = "2.0.18"
unicode-segmentation = "1.13.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "buffer_edits"
harness = false

[[bench]]
name = "projection"
harness = false
