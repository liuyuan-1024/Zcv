[package]
name = "zom-engine"
version = "0.1.0"
edition = "2024"
description = "一个纯粹的、与用户界面无关的文本编辑引擎"

[dependencies]
ropey = "1.6.1"
thiserror = "2.0.18"
unicode-segmentation = "1.13.2"

[dev-dependencies]
criterion = "0.8.2"
# 仅在测试和 examples 沙盒中使用 GPUI
gpui = "0.2.2"

[[example]]
name = "gpui_m1_testbed"
path = "examples/gpui_m1_testbed.rs"
[[example]]
name = "gpui_m2_testbed"
path = "examples/gpui_m2_testbed.rs"
[[example]]
name = "gpui_m3_testbed"
path = "examples/gpui_m3_testbed.rs"
[[example]]
name = "gpui_m4_testbed"
path = "examples/gpui_m4_testbed.rs"
[[example]]
name = "gpui_m5a_testbed"
path = "examples/gpui_m5a_testbed.rs"
[[example]]
name = "gpui_m5b_testbed"
path = "examples/gpui_m5b_testbed.rs"
[[example]]
name = "gpui_m6a_testbed"
path = "examples/gpui_m6a_testbed.rs"
[[example]]
name = "gpui_m6b_testbed"
path = "examples/gpui_m6b_testbed.rs"
[[example]]
name = "gpui_m6c_testbed"
path = "examples/gpui_m6c_testbed.rs"
[[example]]
