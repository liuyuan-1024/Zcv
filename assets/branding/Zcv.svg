    <circle cx="314" cy="271" r="9" opacity=".38"/>
  </g>
  <rect x="359" y="269" width="366" height="4" rx="2" fill="#8298A5" opacity=".43"/>
  <rect x="761" y="262" width="18" height="18" rx="5" fill="#AFC4CB"/>

