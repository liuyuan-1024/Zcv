[package]
name = "zcv-syntax-sample"
version = "0.1.0"
edition = "2024"
description = "语法高亮本地样例"

[features]
default = ["colored"]
colored = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

[workspace.metadata.zcv]
enabled = true
retries = 3
