# 依赖管理约定
#
# 1. **所有第三方 dep（含 dev / 平台特定）在本文件 [workspace.dependencies] 声明**，含版本与默认 features。子 crate 一律 `dep.workspace = true` 引用——版本与feature 升级只在本处改一次。
# 2. 子 crate 需要在 workspace 默认 features 之上**额外加** feature 时，写 `dep = { workspace = true, features = ["extra"] }`；cargo 自动合并。
# 3. 平台特定 dep 也走 workspace 声明，子 crate 在 `[target.'cfg(...)']` 内仍写 `dep.workspace = true`。
# 4. 内部 crate（`zom-*`）按 `path = "..."` 声明，下游同样 `.workspace = true`。
#
# 新加 dep 时：先在本文件登记，再到需要的 crate 引用——不在子 crate 直接 `dep = "x.y"`。

[workspace]
members = [
    "zom-engine",
    "zom-workspace",
    "zom-view",
    "zom-command",
    "zom-ai",
    "zom-desktop",
    "zom-bench",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
# ---- 内部 crate ----
zom-engine = { path = "zom-engine" }
zom-workspace = { path = "zom-workspace" }
zom-view = { path = "zom-view" }
zom-command = { path = "zom-command" }
zom-ai = { path = "zom-ai" }

# ---- 引擎底层（zom-engine） ----
regex = "1.12.3"
ropey = "1.6.1"
thiserror = "2.0.18"
unicode-segmentation = "1.13.2"

# ---- 工作区层（zom-workspace） ----
trash = "5"

# ---- 语法高亮（tree-sitter 系） ----
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = "0.5.3"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"

# ---- 序列化 / 配置 ----
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.23"

# ---- AI 抽象层（zom-ai） ----
futures-core = "0.3.31"
async-trait = "0.1.83"

# ---- 桌面 UI ----
gpui = "0.2.2"

# ---- 平台特定 ----
cocoa = "0.26.0"
raw-window-handle = "0.6.2"
resvg = { version = "0.45.1", default-features = false }
windows = { version = "0.57.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# ---- 开发工具（dev-dependencies 引用） ----
criterion = { version = "0.5", features = ["html_reports"] }
