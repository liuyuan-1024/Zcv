# 依赖管理约定
#
# 1. **所有第三方 dep（含 dev / 平台特定）在本文件 [workspace.dependencies] 声明**，含版本与默认 features。子 crate 一律 `dep.workspace = true` 引用——版本与feature 升级只在本处改一次。
# 2. 子 crate 需要在 workspace 默认 features 之上**额外加** feature 时，写 `dep = { workspace = true, features = ["extra"] }`；cargo 自动合并。
# 3. 平台特定 dep 也走 workspace 声明，子 crate 在 `[target.'cfg(...)']` 内仍写 `dep.workspace = true`。
# 4. 内部 crate（`zcv-*`）按 `path = "..."` 声明，下游同样 `.workspace = true`。
#
# 新加 dep 时：先在本文件登记，再到需要的 crate 引用——不在子 crate 直接 `dep = "x.y"`。

[workspace]
members = [
    "zcv",
    "zcv-actions",
    "zcv-assets",
    "zcv-editor",
    "zcv-fs-watch",
    "zcv-git",
    "zcv-keymap",
    "zcv-language",
    "zcv-multi-buffer",
    "zcv-picker",
    "zcv-project-tree",
    "zcv-preview-svg",
    "zcv-project",
    "zcv-search",
    "zcv-settings",
    "zcv-terminal",
    "zcv-text",
    "zcv-theme",
    "zcv-ui",
    "zcv-workspace",
]
default-members = [
    "zcv",
    "zcv-actions",
    "zcv-assets",
    "zcv-editor",
    "zcv-fs-watch",
    "zcv-git",
    "zcv-keymap",
    "zcv-language",
    "zcv-multi-buffer",
    "zcv-picker",
    "zcv-project-tree",
    "zcv-preview-svg",
    "zcv-project",
    "zcv-search",
    "zcv-settings",
    "zcv-terminal",
    "zcv-text",
    "zcv-theme",
    "zcv-ui",
    "zcv-workspace",
]
resolver = "3"
[workspace.package]
version = "0.8.1"
edition = "2024"

[workspace.lints.clippy]
doc_lazy_continuation = "allow"

[workspace.dependencies]
# ---- 内部 crate ----
zcv-actions = { path = "zcv-actions" }
zcv-assets = { path = "zcv-assets" }
zcv-editor = { path = "zcv-editor" }
zcv-fs-watch = { path = "zcv-fs-watch" }
zcv-git = { path = "zcv-git" }
zcv-keymap = { path = "zcv-keymap" }
zcv-language = { path = "zcv-language" }
zcv-multi-buffer = { path = "zcv-multi-buffer" }
zcv-picker = { path = "zcv-picker" }
zcv-preview-svg = { path = "zcv-preview-svg" }
zcv-project = { path = "zcv-project" }
zcv-project-tree = { path = "zcv-project-tree" }
zcv-search = { path = "zcv-search" }
zcv-settings = { path = "zcv-settings" }
zcv-terminal = { path = "zcv-terminal" }
zcv-text = { path = "zcv-text" }
zcv-theme = { path = "zcv-theme" }
zcv-ui = { path = "zcv-ui" }
zcv-workspace = { path = "zcv-workspace" }

# ---- 文本内核（zcv-text） ----
gpui-sum-tree = { package = "gpui_sum_tree", version = "0.2.2" }
regex = "1.12.3"
regex-automata = "0.4.14"
ropey = "1.6.1"
thiserror = "2.0.18"
unicode-segmentation = "1.13.2"
unicode-width = "0.2"

# ---- 工作区层（zcv-workspace） ----
anyhow = "1.0"
globset = "0.4"
trash = "5"

# ---- 语法高亮（tree-sitter 系） ----
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7.2"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-java = { git = "https://github.com/tree-sitter/tree-sitter-java", rev = "94703d5a6bed02b98e438d7cad1136c01a60ba2c" }
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"

# ---- 序列化 / 配置 ----
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
serde_json_lenient = "0.2.4"
schemars = "1.0"
toml = "0.8.23"

# ---- 桌面 UI ----
gpui = "0.2.2"
rust-embed = { version = "8.11", features = ["include-exclude"] }

# ---- 终端 ----
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
parking_lot = "0.12.1"
sysinfo = "0.37.0"

# ---- 文件监听 ----
notify = "7"
async-channel = "1.9"
crossbeam-channel = "0.5"

# ---- Markdown 渲染 ----
pulldown-cmark = { version = "0.13", default-features = false }

# ---- 数学公式渲染（Markdown preview KaTeX 兼容） ----
ratex-parser = "0.1.12"
ratex-layout = "0.1.12"
ratex-svg = { version = "0.1.12", features = ["standalone", "embed-fonts"] }
ratex-types = "0.1.12"

# ---- SVG 预览 ----
resvg = { version = "0.45.1", default-features = false }

# ---- 平台特定 ----
libc = "0.2"

# ---- 开发工具（dev-dependencies 引用） ----
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "limited"

[profile.dev.package]
zcv-text = { opt-level = 3 }
zcv-editor = { opt-level = 3 }
zcv-language = { opt-level = 3 }
zcv-theme = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
tree-sitter-bash = { opt-level = 3 }
tree-sitter-css = { opt-level = 3 }
tree-sitter-html = { opt-level = 3 }
tree-sitter-java = { opt-level = 3 }
tree-sitter-javascript = { opt-level = 3 }
tree-sitter-json = { opt-level = 3 }
tree-sitter-md = { opt-level = 3 }
tree-sitter-python = { opt-level = 3 }
tree-sitter-rust = { opt-level = 3 }
tree-sitter-toml-ng = { opt-level = 3 }
tree-sitter-typescript = { opt-level = 3 }
tree-sitter-yaml = { opt-level = 3 }
ropey = { opt-level = 3 }
serde_json = { opt-level = 3 }
